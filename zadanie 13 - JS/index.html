<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
         <h1 id="hello">Witaj na mojej stronie</h1>

        <button id="send" onclick="send()">Wyślij</button>

    <form>
            
    <label for="price">Cena: </label>
    <input type="number" id="price" name="price"><br>

    <label for="amount">Ilość: </label>
    <input type="number" id="amount" name="amount"><br>

    <button type="button" id="calculate" onclick="licz()">Oblicz</button>
    
    <p id="result"></p>

    <label for="dlugosc">Długość: </label>
    <input type="number" id="dlugosc" name="dlugosc"><br>

    <label for="szerokosc">Szerokość: </label>
    <input type="number" id="szerokosc" name="szerokosc"><br>

    <label for="plytka">Płytka: </label>
    <input type="number" id="plytka" name="plytka"><br>

    <button type="button" onclick="oblicz()">Oblicz</button>

    <p id="wynik"></p>

    </form>

    <script> 

        function send(){ 
        document.getElementById("hello").textContent = "Udało ci się!"
        }

        function licz(){
            let price = parseFloat(document.getElementById("price").value)
            let amount = parseFloat(document.getElementById("amount").value)
            let result = price * amount
            document.getElementById("result").textContent = "Wynik: " + result
        }

        function oblicz(){
            let dlugosc = parseFloat(document.getElementById("dlugosc").value)
            let szerokosc = parseFloat(document.getElementById("szerokosc").value)
            let plytka = parseFloat(document.getElementById("plytka").value)
            let wynik = (dlugosc * szerokosc) / plytka
            document.getElementById("wynik").textContent = "Wynik: " + wynik
            return false

        }

    </script>

</body>
</html>
